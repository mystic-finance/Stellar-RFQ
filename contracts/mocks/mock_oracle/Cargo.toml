[package]
name = "mock_oracle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Test/testnet price feed with the oracle adapter's view. Not for production."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../../../crates/common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
