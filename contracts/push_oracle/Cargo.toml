[package]
name = "push_oracle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Push oracle: privileged updaters push prices, bounded by a per-push deviation limit"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../../crates/common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
