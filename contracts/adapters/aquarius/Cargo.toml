[package]
name = "aquarius_adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DexAdapter for the Octarine DEX aggregator"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../../../crates/common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
dex_aggregator = { path = "../../aggregators/dex" }
