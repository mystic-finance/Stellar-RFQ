[package]
name = "sep56_adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "VenueAdapter over any SEP-56 vault, including Octarine's own"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../../../crates/common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
vault = { path = "../../vault" }
