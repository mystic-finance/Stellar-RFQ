[package]
name = "verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Checks an ed25519 signature, for contracts that must survive a bad one"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
