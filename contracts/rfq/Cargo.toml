[package]
name = "rfq"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Duration-priced RFQ, fixed order and Dutch auction settlement for Stellar Soroban"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
orders = { path = "../../crates/orders" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "2"
stellar-strkey = "0.0.13"
test_token = { path = "../test_token" }
oracle = { path = "../oracle" }
