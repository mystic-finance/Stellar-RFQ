[package]
name = "call_verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Allowlist of the calls a redemption vault may make with its accounts"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../../crates/common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
