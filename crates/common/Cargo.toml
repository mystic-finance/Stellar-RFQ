[package]
name = "common"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Math and cross-contract interfaces shared by the Octarine contracts"
publish = false

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
