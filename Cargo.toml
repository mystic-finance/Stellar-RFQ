[workspace]
resolver = "2"
members = [
    "contracts/rfq",
    "contracts/router",
    "contracts/oracles/feed_oracle",
    "contracts/oracles/push_oracle",
    "contracts/redemption_vault",
    "contracts/redemption_account",
    "contracts/claim_token",
    "contracts/call_verifier",
    "contracts/crosschain_settle",
    "contracts/verifier",
    "contracts/vault",
    "contracts/facility",
    "contracts/queue",
    "contracts/aggregators/*",
    "contracts/test_token",
    "contracts/adapters/*",
    "contracts/mocks/*",
    "crates/*",
]

[workspace.dependencies]
soroban-sdk = "22"

# Optimised build profile for on-chain WASM. Soroban contracts must be small
# and deterministic, so we strip everything we can and abort on panic.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
